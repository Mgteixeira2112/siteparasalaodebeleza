name: E2E Playwright

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Pages
    types:
      - completed

permissions:
  contents: read

jobs:
  playwright:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://mgteixeira2112.github.io/siteparasalaodebeleza/
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test local browser smoke
        env:
          E2E_LOCAL: '1'
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: npx playwright test tests/e2e/smoke.spec.ts

      - name: Check published site availability
        run: node scripts/wait-for-pages.mjs

      - name: Check authenticated coverage
        if: always()
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo '::error::E2E_EMAIL/E2E_PASSWORD ausentes; testes autenticados NÃO estão homologados.'
            echo '❌ Testes autenticados não executados: configure E2E_EMAIL e E2E_PASSWORD nos Repository secrets em Settings → Secrets and variables → Actions.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo 'Credenciais E2E presentes; executar e verificar resultados autenticados.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test published application
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
